plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'id.jhopanstore.notiflisten'
    compileSdk 35

    defaultConfig {
        applicationId "id.jhopanstore.notiflisten"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1.1"
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
        splits {
            abi {
                enable true
                reset()
                include "armeabi-v7a", "arm64-v8a"
                universalApk true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
}
